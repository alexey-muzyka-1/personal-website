name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Только изменения сайта. Без фильтра любой мердж бота пересобирал и
    # выкатывал сайт заодно — так он однажды уехал на прод незаметно.
    paths:
      - 'src/**'
      - 'public/**'
      - 'articles/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Astro
        uses: withastro/action@v3
        with:
          # Astro 7 требует Node >= 22.12, а действие по умолчанию берёт 20.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
