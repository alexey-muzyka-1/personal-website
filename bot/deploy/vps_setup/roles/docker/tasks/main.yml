---
-   name: Install required packages
    apt:
        name:
            - apt-transport-https
            - ca-certificates
            - curl
            - gpg
            - make
            - rsync
        state: present
        update_cache: yes

-   name: Create keyrings directory
    file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

# Дистрибутив берём из фактов, а не прибиваем: на DigitalOcean по
# умолчанию Ubuntu, а исходная роль в viralmaxing рассчитана на Debian.
-   name: Add Docker GPG key
    get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

-   name: Add Docker repository
    apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        update_cache: yes

-   name: Install Docker and Compose plugin
    apt:
        name:
            - docker-ce
            - docker-compose-plugin
        state: present
        update_cache: yes
    notify: Start docker on boot

-   name: Set periodic Docker prune
    cron:
        name: docker-prune
        job: 'docker system prune -af --filter until=72h'
        minute: '0'
        hour: '1'

-   name: Remove useless packages
    apt:
        autoclean: yes

-   name: Remove useless dependencies
    apt:
        autoremove: yes
